[package]
name = "mac_autocomplete_engine"
version = "0.1.0"
edition = "2021"
authors = ["MacAutoComplete Team"]
description = "Ultra-low-latency autocomplete engine for macOS"
license = "MIT"

[dependencies]
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
bytes = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
lru = "0.12"
parking_lot = "0.12"
dashmap = "6.1"
once_cell = "1"
crossbeam = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
notify = "6"
memmap2 = "0.9"
fnv = "1.0"
ahash = "0.8"
dirs = "5"

# For HTTP client to llama.cpp server
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
default = ["llama-server"]
llama-server = ["reqwest"]
llama-static = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
