[package]
name = "mac_autocomplete_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "1"
lru = "0.12"
parking_lot = "0.12"
dashmap = "5"
once_cell = "1"
dirs = "5"
